name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duração em horas (máx 6)'
        required: false
        default: '6'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ─── 1. RESTAURAR DADOS DA SESSÃO ANTERIOR ───
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous data (artifact)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rdp-data
          path: data/
          workflow: rdp.yml
          if_no_artifact_found: warn

      # ─── 2. CRIAR PASTA DE DADOS ───
      - name: Create data folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Users\runneradmin\Desktop\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "data" | Out-Null

      # ─── 3. CONFIGURAR RDP ───
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $pw = ConvertTo-SecureString "P@ssw0rd!2024" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pw

          $pw2 = ConvertTo-SecureString "Rdp@2024!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $pw2 -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"

          Write-Host "RDP habilitado. User: runneradmin / Pass: P@ssw0rd!2024"

      # ─── 4. INSTALAR TAILSCALE ───
      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 25
          Write-Host "Tailscale instalado."

      # ─── 5. SUBIR TAILSCALE E MOSTRAR IP ───
      - name: Start Tailscale
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-github --accept-routes
          Start-Sleep -Seconds 15

          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          $status = & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host "════════════════════════════════════════"
          Write-Host "        CONEXÃO RDP PRONTA              "
          Write-Host "════════════════════════════════════════"
          Write-Host "  TAILSCALE IP : $ip"
          Write-Host "  USER         : runneradmin"
          Write-Host "  PASS         : P@ssw0rd!2024"
          Write-Host "  ALT USER     : rdpuser"
          Write-Host "  ALT PASS     : Rdp@2024!"
          Write-Host "════════════════════════════════════════"
          Write-Host ""
          Write-Host "Status Tailscale:"
          Write-Host $status

      # ─── 6. MENSAGEM VISÍVEL NO LOG ───
      - name: Show connection info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗"
          Write-Host "║         CONEXÃO RDP PRONTA           ║"
          Write-Host "╠══════════════════════════════════════╣"
          Write-Host "║ 1. Abra o app Tailscale no Android  ║"
          Write-Host "║ 2. Conecte com a mesma conta         ║"
          Write-Host "║ 3. Use o IP do log acima            ║"
          Write-Host "║ 4. User: runneradmin                ║"
          Write-Host "║ 5. Pass: P@ssw0rd!2024              ║"
          Write-Host "╚══════════════════════════════════════╝"

      # ─── 7. MANTER VIVO ───
      - name: Keep alive
        shell: powershell
        run: |
          $hours = [int]"${{ github.event.inputs.duration_hours }}"
          if ($hours -gt 6) { $hours = 6 }
          $seconds = $hours * 3600
          Write-Host "Mantendo sessão viva por $hours hora(s)..."
          Start-Sleep -Seconds $seconds

      # ─── 8. SALVAR DADOS ───
      - name: Save data (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-data
          path: data/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit data to repo
        if: always()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (Test-Path "data") {
            git add data/
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "data: update from session $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
              git push
            } else {
              Write-Host "Sem mudanças para commitar."
            }
          }
