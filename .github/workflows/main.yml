[SCRIPT]
REQUEST GET "https://rdphostings.com/rdp/index.php?rp=/login" 
  
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

PARSE "<SOURCE>" LR "<input type=\"hidden\" name=\"token\" value=\"" "\"" -> VAR "AT" 

REQUEST POST "https://rdphostings.com/rdp/index.php?rp=/login" 
  CONTENT "token=<AT>&username=<USER>&password=<PASS>" 
  CONTENTTYPE "application/x-www-form-urlencoded" 
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

KEYCHECK 
  KEYCHAIN Failure OR 
    KEY "Login Details Incorrect. Please try again." 
  KEYCHAIN Success OR 
    KEY "Logout" 
    KEY "Account Details" 
    KEY "Your Profile" 

REQUEST GET "https://rdphostings.com/rdp/clientarea.php?action=details" 
  
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

PARSE "<SOURCE>" LR "name=\"firstname\" id=\"inputFirstName\" value=\"" "\"" -> VAR "F" 

PARSE "<SOURCE>" LR "name=\"lastname\" id=\"inputLastName\" value=\"" "\"" -> VAR "L" 

FUNCTION Constant "<F> & <L>" -> CAP "FullName" 

REQUEST GET "https://rdphostings.com/rdp/clientarea.php?action=services" 
  
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

PARSE "<SOURCE>" LR "<span class=\"badge\">" "</span>                            <i class=\"far fa-circle\"></i>&nbsp;                            <span>Active</span>" CreateEmpty=FALSE -> CAP "Plan" 

KEYCHECK 
  KEYCHAIN Success OR 
    KEY "<Plan>" Contains "0" 
  KEYCHAIN Custom "CUSTOM" OR 
    KEY "<Plan>" Contains "0" 

