name: Windows RDP via ngrok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
    
    - name: Configurar ngrok com token
      run: .\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    
    - name: Habilitar RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
    
    - name: Definir senha do usuário
      run: net user runneradmin P@ssw0rd!
    
    - name: Iniciar túnel ngrok
      run: .\ngrok.exe tcp 3389 --region usPARSE "<SOURCE>" LR "<input type=\"hidden\" name=\"token\" value=\"" "\"" -> VAR "AT" 

REQUEST POST "https://rdphostings.com/rdp/index.php?rp=/login" 
  CONTENT "token=<AT>&username=<USER>&password=<PASS>" 
  CONTENTTYPE "application/x-www-form-urlencoded" 
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

KEYCHECK 
  KEYCHAIN Failure OR 
    KEY "Login Details Incorrect. Please try again." 
  KEYCHAIN Success OR 
    KEY "Logout" 
    KEY "Account Details" 
    KEY "Your Profile" 

REQUEST GET "https://rdphostings.com/rdp/clientarea.php?action=details" 
  
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

PARSE "<SOURCE>" LR "name=\"firstname\" id=\"inputFirstName\" value=\"" "\"" -> VAR "F" 

PARSE "<SOURCE>" LR "name=\"lastname\" id=\"inputLastName\" value=\"" "\"" -> VAR "L" 

FUNCTION Constant "<F> & <L>" -> CAP "FullName" 

REQUEST GET "https://rdphostings.com/rdp/clientarea.php?action=services" 
  
  HEADER "User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; Trident/7.0; rv:11.0) like Gecko" 
  HEADER "Pragma: no-cache" 
  HEADER "Accept: */*" 

PARSE "<SOURCE>" LR "<span class=\"badge\">" "</span>                            <i class=\"far fa-circle\"></i>&nbsp;                            <span>Active</span>" CreateEmpty=FALSE -> CAP "Plan" 

KEYCHECK 
  KEYCHAIN Success OR 
    KEY "<Plan>" Contains "0" 
  KEYCHAIN Custom "CUSTOM" OR 
    KEY "<Plan>" Contains "0" 

