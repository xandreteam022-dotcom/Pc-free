name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duração em horas (máx 6)'
        required: false
        default: '6'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ─── 1. RESTAURAR DADOS DA SESSÃO ANTERIOR ───
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous data (artifact)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: rdp-data
          path: data/
          workflow: rdp.yml
          if_no_artifact_found: warn

      # ─── 2. CONFIGURAR RDP ───
      - name: Enable RDP
        shell: powershell
        run: |
          # Habilita RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Define senha do usuário runneradmin
          $pw = ConvertTo-SecureString "P@ssw0rd!2024" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pw

          # Cria segundo usuário (opcional, mais estável)
          $pw2 = ConvertTo-SecureString "Rdp@2024!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $pw2 -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"

          Write-Host "RDP habilitado. User: runneradmin / Pass: P@ssw0rd!2024"

      # ─── 3. TÚNEL NGROK ───
      - name: Setup ngrok
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "C:\ngrok"
          C:\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok tunnel
        shell: powershell
        run: |
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 15

          $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $url = $tunnels.tunnels[0].public_url -replace "tcp://", ""
          Write-Host "════════════════════════════════════════"
          Write-Host "  HOST: $url"
          Write-Host "  USER: runneradmin"
          Write-Host "  PASS: P@ssw0rd!2024"
          Write-Host "════════════════════════════════════════"

      # ─── 4. MENSAGEM VISÍVEL NO LOG ───
      - name: Show connection info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗"
          Write-Host "║         CONEXÃO RDP PRONTA           ║"
          Write-Host "╠══════════════════════════════════════╣"
          Write-Host "║ Use os dados do passo anterior      ║"
          Write-Host "║ Host: (pegue no log do ngrok)       ║"
          Write-Host "║ User: runneradmin                   ║"
          Write-Host "║ Pass: P@ssw0rd!2024                 ║"
          Write-Host "╚══════════════════════════════════════╝"

      # ─── 5. MANTER VIVO ───
      - name: Keep alive
        shell: powershell
        run: |
          $hours = [int]"${{ github.event.inputs.duration_hours }}"
          if ($hours -gt 6) { $hours = 6 }
          $seconds = $hours * 3600
          Write-Host "Mantendo sessão viva por $hours hora(s)..."
          Start-Sleep -Seconds $seconds

      # ─── 6. SALVAR DADOS ───
      - name: Save data (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-data
          path: data/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit data to repo
        if: always()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (Test-Path "data") {
            git add data/
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "data: update from session $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
              git push
            } else {
              Write-Host "Sem mudanças para commitar."
            }
          }
