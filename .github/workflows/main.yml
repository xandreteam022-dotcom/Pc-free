name: RDP Persistente

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Roda a cada 5 horas (antes do limite de 6h)

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360  # 6 horas (limite do grátis)
    
    steps:
      - name: RDP com Persistência
        run: |
          # Ativa RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Verifica se usuário já existe (NÃO RECRIA)
          $userExists = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          if (-not $userExists) {
            $pass = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 12 | % {[char]$_})
            New-LocalUser -Name "RDP" -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member "RDP"
            echo "SENHA=$pass" >> $env:GITHUB_ENV
          } else {
            # Mantém usuário existente
            echo "Usuário RDP já existe - mantendo configurações"
          }
          
          # Instala Tailscale só se não existir
          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi"
            Start-Process msiexec -Wait -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet"
          }
          
          # Conecta Tailscale (mantém IP)
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=meu-rdp-permanente
          
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          
          Write-Host "=== RDP ACESSO ==="
          Write-Host "IP: $ip (SEMPRE O MESMO!)"
          Write-Host "Usuário: RDP"
          if ($env:SENHA) {
            Write-Host "Senha: $env:SENHA"
          } else {
            Write-Host "Senha: (a mesma de antes)"
          }
          Write-Host "=================="
          
          # Mantém rodando até o limite de 6h
          $startTime = Get-Date
          while ((Get-Date) -lt $startTime.AddHours(5.5)) {
            Write-Host "[$(Get-Date)] RDP Ativo - Conexões mantidas!"
            Start-Sleep -Seconds 3600
          }
